[project]
name = "pve-usv"
dynamic = ["version"]  # single source of truth: app/__init__.py __version__
description = "PVE-UPS — UPS shutdown appliance for Proxmox VE: web-configured, no config files (SNMP via RFC 1628 or a vendor MIB, or a NUT server; multi-UPS, LXC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Florian Finder" }]
keywords = ["proxmox", "proxmox-ve", "ups", "snmp", "nut", "usb-ups", "shutdown", "lxc", "rfc1628"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Power (UPS)",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pysnmp>=6.2",            # lextudio fork, async SNMP v1/v2c/v3
    # pysnmp 7.x ships no ciphers of its own and delegates SNMPv3 privacy (DES/3DES/AES)
    # to this package; without it every authPriv poll fails with "Ciphering services not
    # available". It declares the dependency only in its dev extra, so we must pull it in.
    # Floor 43: DES/3DES import cryptography.hazmat.decrepit, which starts there. Capped
    # below 50 on purpose: pysnmp's AES still uses primitives.ciphers.modes.CFB, which
    # cryptography 49 deprecates and announces for removal — an uncapped upgrade would
    # silently break SNMPv3 privacy again. Lift the cap once pysnmp moved to decrepit.
    "cryptography>=43,<50",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "passlib[argon2]>=1.7",  # UI password hashing
    "itsdangerous>=2.1",     # signed session cookies
    "python-multipart>=0.0.9",  # multipart form parsing for the update upload
    "asyncssh>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "snmpsim>=1.1",          # simulate a UPS SNMP agent for testing
]

[project.urls]
Homepage = "https://github.com/ffind-dev/pve-ups"
Changelog = "https://github.com/ffind-dev/pve-ups/blob/main/CHANGELOG.md"
Issues = "https://github.com/ffind-dev/pve-ups/issues"

[project.scripts]
pve-usv = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.package-data]
app = ["web/*", "web/i18n/*", "remote/*"]
